{% extends "base.html" %}

{% block content %}
<h1 class="font-serif text-4xl font-medium tracking-tight">AI Build Night 002</h1>
<p class="mt-3 text-lg text-muted">Built live with FastAPI, HTMX and Tailwind.</p>

<section class="mt-10 rounded-2xl border border-line bg-surface p-6 shadow-sm">
  <h2 class="font-serif text-xl font-medium">Server round trip</h2>
  <p class="mt-1 text-muted">The button asks the server for a fragment and swaps it in below.</p>

  <button
    class="mt-5 inline-flex items-center gap-2 rounded-xl bg-accent px-4 py-2 font-medium text-white transition hover:bg-accent-strong focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
    hx-get="/fragments/ping"
    hx-target="#ping-result"
  >
    {# Heroicons: arrow-path, outline, 24px #}
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
    Ping the server
  </button>

  <div id="ping-result" class="mt-5" aria-live="polite"></div>
</section>
{% endblock %}
