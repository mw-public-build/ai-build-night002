<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KWENCH Live{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=3">
    <script src="{{ url_for('static', path='js/htmx-2.0.11.min.js') }}" defer></script>
  </head>
  <body class="min-h-screen bg-canvas font-sans text-ink antialiased">
    <main class="mx-auto max-w-7xl px-4 py-3">
      {% block content %}{% endblock %}
    </main>
    <script>
      // Keep open fold-outs open when the board refreshes every 3s.
      let openDetails = [];
      document.addEventListener("htmx:beforeSwap", () => {
        openDetails = [...document.querySelectorAll("details[open][id]")].map((d) => d.id);
      });
      document.addEventListener("htmx:afterSwap", () => {
        for (const id of openDetails) {
          const details = document.getElementById(id);
          if (details) details.open = true;
        }
      });
    </script>
  </body>
</html>
